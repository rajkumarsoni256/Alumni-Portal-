<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <rect width="1000" height="260" rx="30" fill="#e31b23"/>
  <g transform="translate(45, 30)">
    <!-- JECRC Shield Icon -->
    <path d="M60,20 C100,20 120,40 120,80 C120,140 60,180 60,180 C60,180 0,140 0,80 C0,40 20,20 60,20 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <!-- Sun / Globe / Book Inner Motifs -->
    <circle cx="60" cy="70" r="14" fill="#ffffff"/>
    <path d="M40,110 Q60,95 80,110 L80,135 Q60,120 40,135 Z" fill="#ffffff"/>
    <path d="M60,140 L45,160 L75,160 Z" fill="#ffffff"/>
    <circle cx="35" cy="50" r="6" fill="#ffffff"/>
    <circle cx="85" cy="50" r="6" fill="#ffffff"/>
    <circle cx="35" cy="85" r="5" fill="#ffffff"/>
    <circle cx="85" cy="85" r="5" fill="#ffffff"/>
  </g>
  <!-- JECRC University Text -->
  <g transform="translate(185, 95)" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif">
    <text x="0" y="0" font-size="54" font-weight="bold" letter-spacing="2">JECRC</text>
    <text x="240" y="-30" font-size="18" font-weight="bold">TM</text>
    <text x="0" y="42" font-size="34" letter-spacing="4" font-weight="normal">UNIVERSITY</text>
    <text x="0" y="78" font-size="20" letter-spacing="3" font-weight="bold" font-family="system-ui, sans-serif">BUILD YOUR WORLD</text>
  </g>
  <!-- Vertical Divider -->
  <line x1="500" y1="35" x2="500" y2="225" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- JMCH Right Side -->
  <g transform="translate(540, 145)" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">
    <text x="0" y="0" font-size="96" font-weight="900" letter-spacing="6">JMCH</text>
    <text x="0" y="46" font-size="24" font-weight="800" letter-spacing="1">JECRC Medical College and Hospital</text>
  </g>
</svg>
