<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Curved Path for Top Ribbon Text -->
    <path id="topRibbonArc" d="M 90 125 A 220 220 0 0 1 410 125" fill="none" />
    <!-- Curved Path for Bottom Tagline Text -->
    <path id="bottomTextArc" d="M 80 440 A 230 230 0 0 0 420 440" fill="none" />
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 1. TOP RED BANNER RIBBON -->
  <g filter="url(#shadow)">
    <path d="M 75 140 C 140 60, 360 60, 425 140 L 390 190 C 340 130, 160 130, 110 190 Z" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    <!-- Ribbon Tails -->
    <path d="M 75 140 L 30 195 L 65 145 L 30 95 Z" fill="#dc2626"/>
    <path d="M 425 140 L 470 195 L 435 145 L 470 95 Z" fill="#dc2626"/>
    <path d="M 110 190 C 130 160, 370 160, 390 190 C 340 135, 160 135, 110 190 Z" fill="#b91c1c"/>
  </g>

  <!-- Ribbon Text: JU ALUMNI -->
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" letter-spacing="4">
    <textPath href="#topRibbonArc" startOffset="50%" text-anchor="middle">
      JU ALUMNI
    </textPath>
  </text>

  <!-- 2. CENTRAL RED SHIELD -->
  <g transform="translate(0, 30)">
    <!-- Shield Outline -->
    <path d="M 250 115 C 340 115, 370 200, 365 290 C 350 370, 250 435, 250 435 C 250 435, 150 370, 135 290 C 130 200, 160 115, 250 115 Z" 
          fill="#ffffff" stroke="#ef4444" stroke-width="6"/>

    <!-- Flame Icon (Red) -->
    <path d="M 250 150 C 265 175, 280 185, 275 210 C 270 230, 250 240, 250 240 C 250 240, 230 230, 225 210 C 220 185, 235 175, 250 150 Z" fill="#ef4444"/>
    <path d="M 250 170 C 258 185, 265 192, 262 208 C 258 220, 250 225, 250 225 C 250 225, 242 220, 238 208 C 235 192, 242 185, 250 170 Z" fill="#f87171"/>

    <!-- Open Book Icon (Black) -->
    <path d="M 250 255 Q 210 235, 175 250 L 175 285 Q 210 270, 250 288 Q 290 270, 325 285 L 325 250 Q 290 235, 250 255 Z" fill="#1e293b"/>
    <line x1="250" y1="255" x2="250" y2="288" stroke="#ffffff" stroke-width="3"/>

    <!-- Person Figure (Black) -->
    <circle cx="250" cy="305" r="10" fill="#1e293b"/>
    <path d="M 250 322 L 210 290 L 225 350 L 250 410 L 275 350 L 290 290 Z" fill="#1e293b"/>
  </g>

  <!-- 3. LAUREL WREATH LEAVES (RED) -->
  <g fill="#ef4444">
    <!-- Left Wreath Leaves -->
    <path d="M 120 260 Q 100 245, 105 230 Q 120 240, 120 260 Z"/>
    <path d="M 110 300 Q 85 285, 92 270 Q 110 280, 110 300 Z"/>
    <path d="M 112 340 Q 88 330, 95 312 Q 112 322, 112 340 Z"/>
    <path d="M 125 380 Q 100 375, 108 358 Q 125 365, 125 380 Z"/>
    <path d="M 148 415 Q 125 415, 130 398 Q 148 402, 148 415 Z"/>
    <path d="M 180 445 Q 160 450, 162 432 Q 180 435, 180 445 Z"/>

    <!-- Right Wreath Leaves -->
    <path d="M 380 260 Q 400 245, 395 230 Q 380 240, 380 260 Z"/>
    <path d="M 390 300 Q 415 285, 408 270 Q 390 280, 390 300 Z"/>
    <path d="M 388 340 Q 412 330, 405 312 Q 388 322, 388 340 Z"/>
    <path d="M 375 380 Q 400 375, 392 358 Q 375 365, 375 380 Z"/>
    <path d="M 352 415 Q 375 415, 370 398 Q 352 402, 352 415 Z"/>
    <path d="M 320 445 Q 340 450, 338 432 Q 320 435, 320 445 Z"/>
  </g>

  <!-- 4. BOTTOM TAGLINE: Let's Unite, Grow Together -->
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#1e293b" letter-spacing="1">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      Let’s Unite, Grow Together
    </textPath>
  </text>
</svg>
